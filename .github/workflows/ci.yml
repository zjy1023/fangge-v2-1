name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run form engine fixture
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          COMMIT_MESSAGE="$(git log -1 --pretty=%B "$TARGET_SHA")"
          echo "commit message: $COMMIT_MESSAGE"
          python form_engine.py "$COMMIT_MESSAGE"
      - name: Test pass marker
        run: echo "test pass"
